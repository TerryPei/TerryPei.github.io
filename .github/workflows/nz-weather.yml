name: nz-weather
# 每 3 小时把 MetService 官方预警 + Open-Meteo 预报翻译成行程决策，写进 nz/wx.json。
# 脚本和 ~/Desktop/Repos/裴老师李老师/wx_live.py 是同一份，由 deploy_nz.sh 复制过来。
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nz-weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build nz/wx.json
        run: python .github/scripts/nz_wx.py nz/wx.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- nz/wx.json; then echo "no change"; exit 0; fi
          git config user.name "nz-weather"
          git config user.email "actions@users.noreply.github.com"
          git add nz/wx.json
          git commit -m "nz: weather decisions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
