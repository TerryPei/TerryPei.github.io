<style>
  :root{--bg:#0f1117;--panel:#171a23;--ink:#e8eaf0;--muted:#9aa3b2;--line:#2a2f3b;--accent:#76b900;--bad:#ef4444;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 30px;max-width:380px;width:calc(100% - 40px);text-align:center}

  h1{font-size:21px;margin:12px 0 6px;letter-spacing:-.3px}
  p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  form{display:flex;gap:8px}
  input{flex:1;background:#0c0e14;border:1px solid var(--line);border-radius:8px;padding:11px 13px;color:var(--ink);font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#0b0d12;border:0;border-radius:8px;padding:0 18px;font:700 14px/1 inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:12px;font-family:var(--mono)}
</style></head>

function b64d(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function tryDecrypt(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(IV)},key,b64d(CT));
  return new TextDecoder().decode(pt);
}
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.addEventListener("submit",async ev=>{
  ev.preventDefault(); e.textContent=""; b.disabled=true;
  try{
    const html=await tryDecrypt(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  }catch(_){ e.textContent="Wrong password."; b.disabled=false; document.getElementById("pw").select(); }
});
